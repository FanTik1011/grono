<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Додати новину</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="p-4">

  <div class="container">
    <h2>Додати новину</h2>
    <form method="POST" enctype="multipart/form-data">
      <div class="mb-3">
        <label for="title" class="form-label">Заголовок</label>
        <input type="text" name="title" id="title" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="content" class="form-label">Текст новини</label>
        <textarea name="content" id="content" class="form-control" rows="5" required></textarea>
      </div>
      <div class="mb-3">
        <label for="images" class="form-label">Зображення (можна декілька)</label>
        <input type="file" name="images" id="images" class="form-control" multiple>
      </div>
      <button type="submit" class="btn btn-success">Опублікувати</button>
      <a href="{{ url_for('profile') }}" class="btn btn-secondary">Назад</a>
    </form>
  </div>

</body>
</html>
