<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Додати новину</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #f1f8e9, #e3f2fd);
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .news-form-card {
      background: #fff;
      border-radius: 1.5rem;
      padding: 2rem;
      max-width: 600px;
      width: 100%;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      animation: slideIn 0.4s ease;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    h2 {
      text-align: center;
      color: #388e3c;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }

    .form-label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .form-control {
      border-radius: 0.75rem;
      padding: 0.75rem;
      font-size: 1rem;
    }

    .btn-success {
      background-color: #388e3c;
      border: none;
      font-weight: bold;
      transition: background-color 0.3s ease;
      border-radius: 0.75rem;
    }

    .btn-success:hover {
      background-color: #2e7d32;
    }

    .btn-secondary {
      border-radius: 0.75rem;
      font-weight: 500;
    }

    @media (max-width: 480px) {
      .news-form-card {
        padding: 1.5rem 1rem;
        margin: 1rem;
      }

      h2 {
        font-size: 1.5rem;
      }

      .form-control {
        font-size: 0.95rem;
        padding: 0.65rem;
      }

      .btn {
        font-size: 0.95rem;
        padding: 0.65rem;
      }
    }
  </style>
</head>
<body>
  <div class="news-form-card">
    <h2>📰 Додати новину</h2>
    <form method="POST" enctype="multipart/form-data">
      <div class="mb-3">
        <label for="title" class="form-label">Заголовок</label>
        <input type="text" name="title" id="title" class="form-control" required />
      </div>
      <div class="mb-3">
        <label for="content" class="form-label">Текст новини</label>
        <textarea name="content" id="content" class="form-control" rows="5" required></textarea>
      </div>
      <div class="mb-3">
        <label for="images" class="form-label">Зображення (можна декілька)</label>
        <input type="file" name="images" id="images" class="form-control" multiple />
      </div>
      <div class="d-flex flex-column flex-sm-row gap-2">
        <button type="submit" class="btn btn-success w-100">✅ Опублікувати</button>
        <a href="{{ url_for('profile') }}" class="btn btn-secondary w-100">↩️ Назад</a>
      </div>
    </form>
  </div>
</body>
</html>
