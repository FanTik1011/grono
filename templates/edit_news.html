<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Редагування новини</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>
  <div class="container py-5">
    <h1>Редагування новини</h1>
    <form method="POST">
      <div class="mb-3">
        <label for="title" class="form-label">Заголовок</label>
        <input type="text" name="title" id="title" class="form-control" value="{{ news_item.title }}" required>
      </div>
      <div class="mb-3">
        <label for="content" class="form-label">Зміст</label>
        <textarea name="content" id="content" class="form-control" rows="5" required>{{ news_item.content }}</textarea>
      </div>
      <button type="submit" class="btn btn-primary">Зберегти</button>
      <a href="{{ url_for('news') }}" class="btn btn-secondary">Скасувати</a>
    </form>
  </div>
</body>
</html>
