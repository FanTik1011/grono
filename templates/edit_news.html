<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Редагування новини</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #f3e5f5, #e0f2f1);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .edit-news-card {
      background: white;
      border-radius: 1.25rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      padding: 2rem;
      width: 100%;
      max-width: 600px;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-weight: 700;
      font-size: 1.75rem;
      text-align: center;
      color: #6a1b9a;
      margin-bottom: 1.5rem;
    }

    .form-label {
      font-weight: 600;
      font-size: 0.95rem;
    }

    .form-control {
      border-radius: 0.75rem;
      font-size: 1rem;
      padding: 0.75rem;
    }

    .btn-primary {
      background-color: #6a1b9a;
      border: none;
      font-weight: bold;
      border-radius: 0.75rem;
      transition: background-color 0.3s ease;
    }

    .btn-primary:hover {
      background-color: #8e24aa;
    }

    .btn-secondary {
      border-radius: 0.75rem;
      font-weight: 500;
    }

    @media (max-width: 480px) {
      .edit-news-card {
        padding: 1.5rem 1rem;
        margin: 1rem;
      }

      h1 {
        font-size: 1.4rem;
      }

      .form-control {
        font-size: 0.95rem;
        padding: 0.65rem;
      }

      .btn {
        font-size: 0.95rem;
        padding: 0.65rem;
      }
    }
  </style>
</head>
<body>
  <div class="edit-news-card">
    <h1>Редагування новини</h1>
    <form method="POST">
      <div class="mb-3">
        <label for="title" class="form-label">Заголовок</label>
        <input type="text" name="title" id="title" class="form-control" value="{{ news_item.title }}" required>
      </div>
      <div class="mb-3">
        <label for="content" class="form-label">Зміст</label>
        <textarea name="content" id="content" class="form-control" rows="6" required>{{ news_item.content }}</textarea>
      </div>
      <div class="d-flex flex-column flex-sm-row gap-2">
        <button type="submit" class="btn btn-primary w-100">💾 Зберегти</button>
        <a href="{{ url_for('news') }}" class="btn btn-secondary w-100">↩️ Скасувати</a>
      </div>
    </form>
  </div>
</body>
</html>
