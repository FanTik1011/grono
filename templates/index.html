<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-5">
    <div class="container">
        <h1 class="mb-4">To-Do List</h1>
        <form method="POST" action="/add" class="input-group mb-3">
            <input name="content" class="form-control" placeholder="Нова задача">
            <button class="btn btn-primary">Додати</button>
        </form>
        <ul class="list-group">
            {% for task in tasks %}
            <li class="list-group-item d-flex justify-content-between">
                {{ task.content }}
                <a href="/delete/{{ task.id }}" class="btn btn-danger btn-sm">Видалити</a>
            </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
