<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Мій профіль</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(135deg, #dbeafe, #f3e8ff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: 'Segoe UI', sans-serif;
    }

    .profile-card {
      width: 100%;
      max-width: 520px;
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(12px);
      border-radius: 25px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.15);
      padding: 2.5rem;
      animation: fadeIn 0.6s ease;
      text-align: center;
    }

    .avatar-wrapper {
      position: relative;
      width: 150px;
      height: 150px;
      margin: auto;
      margin-bottom: 15px;
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      box-shadow: 0 0 0 6px #fff, 0 0 35px rgba(0, 0, 0, 0.2);
      transition: 0.3s;
    }

    .edit-avatar-btn {
      position: absolute;
      bottom: 0;
      right: 0;
      background: #0d6efd;
      color: white;
      border: none;
      border-radius: 50%;
      width: 42px;
      height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 10px rgba(0,0,0,0.25);
    }

    .btn-custom {
      border-radius: 12px;
      padding: 10px 15px;
      font-weight: 600;
    }

    #save-btn {
      display: none;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>
  <div class="profile-card">

    <form method="POST" enctype="multipart/form-data" id="profile-form">

      <!-- АВАТАР -->
      <div class="avatar-wrapper">
        <img id="avatar-preview"
             src="{{ user.avatar if user.avatar else '/static/img/default-avatar.png' }}">

        <label class="edit-avatar-btn">
          <input type="file" name="avatar" id="avatar-input" accept="image/*" hidden>
          <i class="bi bi-camera"></i>
        </label>
      </div>

      <h3 class="fw-bold mb-1">{{ user.username }}</h3>

      {% if is_admin %}
      <span class="badge bg-purple text-white">Адміністратор</span>
      {% else %}
      <span class="badge bg-secondary">Користувач</span>
      {% endif %}

      <!-- ДАНІ -->
      <div class="mt-4 text-start">

        <label class="form-label fw-semibold">Імʼя</label>
        <input type="text" class="form-control" name="name" id="name"
               value="{{ user.name }}">

        <label class="form-label fw-semibold mt-3">Прізвище</label>
        <input type="text" class="form-control" name="surname" id="surname"
               value="{{ user.surname }}">

      </div>

      <!-- КНОПКА ЗБЕРЕГТИ -->
      <button id="save-btn" class="btn btn-primary btn-custom w-100 mt-4">
        Зберегти зміни
      </button>

    </form>

    <hr class="my-4">

    <!-- КНОПКИ -->
    <div class="d-grid gap-2">

      <a href="{{ url_for('index') }}" class="btn btn-outline-primary btn-custom">
        На головну
      </a>

      {% if is_admin %}
      <a href="{{ url_for('add_news') }}" class="btn btn-success btn-custom">
        Додати новину
      </a>

      <a href="{{ url_for('users_database') }}" class="btn btn-warning btn-custom">
        База даних
      </a>
      {% endif %}

      <a href="{{ url_for('logout') }}" class="btn btn-outline-danger btn-custom">
        Вийти
      </a>

    </div>
  </div>

  <script>
    const saveBtn = document.getElementById("save-btn");
    const nameInput = document.getElementById("name");
    const surnameInput = document.getElementById("surname");
    const avatarInput = document.getElementById("avatar-input");
    const avatarPreview = document.getElementById("avatar-preview");

    function showSave() {
      saveBtn.style.display = "block";
    }

    nameInput.addEventListener("input", showSave);
    surnameInput.addEventListener("input", showSave);

    avatarInput.addEventListener("change", () => {
      showSave();
      const file = avatarInput.files[0];
      if (file) {
        avatarPreview.src = URL.createObjectURL(file);
      }
    });
  </script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</body>
</html>
