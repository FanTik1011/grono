<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Мій профіль</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #dbeafe, #f1f5f9);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
      padding: 30px;
    }

    /* 🌟 КАРТКА */
    .profile-card {
      width: 100%;
      max-width: 550px;
      padding: 2.8rem;
      border-radius: 2rem;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.3);
      box-shadow: 0 20px 50px rgba(0,0,0,0.12);
      animation: fadeIn .5s ease;
      text-align: center;
    }

    /* 🌟 КРУГЛА АВАТАРКА */
    .avatar-wrapper {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      margin: 0 auto;
      padding: 4px;

      background: linear-gradient(135deg, #60a5fa, #9333ea);
      box-shadow: 0 0 25px rgba(99, 102, 241, .35);
    }

    .avatar-inner {
      background: white;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      overflow: hidden;
    }

    .avatar {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      transition: transform .3s ease;
    }

    .avatar:hover {
      transform: scale(1.07);
    }

    input[type="file"] {
      border-radius: 1rem;
      border: 1px solid #d1d5db;
      padding: .6rem;
    }

    label {
      font-weight: 600;
      margin-top: 10px;
      color: #4b5563;
    }

    .profile-card input {
      border-radius: 1rem;
      padding: .75rem;
      text-align: center;
      border: 1px solid #d1d5db;
      transition: .25s;
    }

    .profile-card input:focus {
      border-color: #6366f1;
      box-shadow: 0 0 0 4px rgba(99, 102, 241, .25);
    }

    .role-badge {
      padding: .45rem 1rem;
      border-radius: 1rem;
      font-weight: 600;
      display: inline-block;
      margin-top: 5px;
    }

    .admin {
      background: linear-gradient(135deg, #7c3aed, #5b21b6);
      color: white;
    }

    .user {
      background: #94a3b8;
      color: white;
    }

    @keyframes fadeIn {
      from {opacity:0; transform: translateY(20px);}
      to {opacity:1; transform: translateY(0);}
    }

  </style>
</head>
<body>

  <div class="profile-card">

    <form method="POST" enctype="multipart/form-data">

      <!-- 🌟 АВАТАР -->
      <div class="avatar-wrapper mb-3">
        <div class="avatar-inner">
          <img src="{{ user.avatar if user.avatar else '/static/img/default-avatar.png' }}"
               id="avatarPreview"
               class="avatar">
        </div>
      </div>

      <input type="file" name="avatar" class="form-control mb-4" onchange="previewImage(event)">

      <!-- 🔤 ІМ'Я -->
      <label>Ім’я:</label>
      <input type="text" name="name"
             value="{{ user.name }}"
             required
             class="form-control mb-2">

      <!-- 🔤 Прізвище -->
      <label>Прізвище:</label>
      <input type="text" name="surname"
             value="{{ user.surname }}"
             required
             class="form-control mb-3">

      <!-- ✉ Email -->
      <p class="mt-3 text-muted">
        <i class="bi bi-envelope"></i> {{ user.email }}
      </p>

      <!-- 🛡 Роль -->
      {% if user.is_admin %}
        <span class="role-badge admin">Адміністратор</span>
      {% else %}
        <span class="role-badge user">Користувач</span>
      {% endif %}

      <div class="d-grid gap-2 mt-4">
        <button class="btn btn-success btn-lg">
          <i class="bi bi-check-circle"></i> Зберегти зміни
        </button>

        <a href="{{ url_for('index') }}" class="btn btn-outline-primary">
          <i class="bi bi-house-door"></i> На головну
        </a>

        <a href="{{ url_for('logout') }}" class="btn btn-outline-danger">
          <i class="bi bi-box-arrow-right"></i> Вийти
        </a>
      </div>

    </form>
  </div>


<script>
  // Прев’ю аватарки в реальному часі
  function previewImage(event) {
    const reader = new FileReader();
    reader.onload = function(){
      document.getElementById('avatarPreview').src = reader.result;
    };
    reader.readAsDataURL(event.target.files[0]);
  }
</script>

</body>
</html>
