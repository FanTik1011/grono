<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профіль</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #e0f7fa, #f3e5f5);
            min-height: 100vh;
            font-family: 'Segoe UI', sans-serif;
        }

        .profile-card {
            background: #fff;
            border-radius: 25px;
            padding: 2rem;
            box-shadow: 0 15px 40px rgba(0,0,0,0.15);
            max-width: 600px;
            margin: 3rem auto;
        }

        .avatar-wrapper {
            display: flex;
            justify-content: center;
            margin-bottom: 1.5rem;
        }

        .avatar-wrapper img {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 0 0 6px #fff, 0 0 20px rgba(0,0,0,0.25);
            transition: 0.3s ease;
        }

        .avatar-wrapper img:hover {
            transform: scale(1.05);
        }

        #save-btn {
            display: none;
        }

        .btn-grad {
            background: linear-gradient(45deg, #6a1b9a, #ab47bc);
            color: white !important;
            border-radius: 12px;
            padding: 10px 18px;
            border: none;
        }

        .btn-grad:hover {
            opacity: .85;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header-actions">
        <a href="/admin" class="btn btn-primary">База даних</a>
        <a href="/add_news" class="btn btn-success">Додати новину</a>
    </div>

    <div class="profile-card">

        <form method="POST" enctype="multipart/form-data" id="profile-form">

            <div class="avatar-wrapper">
                <img id="avatar-preview"
                     src="{{ user.avatar if user.avatar else '/static/img/default-avatar.png' }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Змінити аватар</label>
                <input type="file" class="form-control" name="avatar" id="avatar-input" accept="image/*">
            </div>

            <div class="mb-3">
                <label class="form-label">Ім'я</label>
                <input type="text" class="form-control" name="name" id="name" value="{{ user.name }}">
            </div>

            <div class="mb-3">
                <label class="form-label">Прізвище</label>
                <input type="text" class="form-control" name="surname" id="surname" value="{{ user.surname }}">
            </div>

            <button id="save-btn" class="btn btn-grad w-100 mt-3">Зберегти зміни</button>

        </form>
    </div>
</div>

<script>
    const form = document.getElementById("profile-form");
    const saveBtn = document.getElementById("save-btn");

    const nameInput = document.getElementById("name");
    const surnameInput = document.getElementById("surname");
    const avatarInput = document.getElementById("avatar-input");

    const avatarPreview = document.getElementById("avatar-preview");

    // Показуємо кнопку, якщо щось змінили
    function showSave() {
        saveBtn.style.display = "block";
    }

    nameInput.addEventListener("input", showSave);
    surnameInput.addEventListener("input", showSave);
    avatarInput.addEventListener("change", () => {
        showSave();

        // Прев'ю аватарки
        const file = avatarInput.files[0];
        if (file) {
            avatarPreview.src = URL.createObjectURL(file);
        }
    });
</script>

</body>
</html>
