<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Мій профіль</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #f3f4f6, #e2e8f0);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', sans-serif;
    }
    .profile-card {
      background: #fff;
      padding: 2.5rem;
      border-radius: 1.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      text-align: center;
      width: 100%;
      max-width: 480px;
      animation: fadeIn 0.6s ease-in-out;
    }
    .profile-icon {
      font-size: 4rem;
      color: #0d6efd;
      margin-bottom: 1rem;
    }
    .btn {
      border-radius: 1rem;
    }
    .info-label {
      font-weight: 600;
      color: #6c757d;
    }
    .info-value {
      font-size: 1.1rem;
      margin-bottom: 0.5rem;
    }
    .badge-admin {
      background-color: #6f42c1;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <div class="profile-card">
    <i class="bi bi-person-circle profile-icon"></i>
    <h2 class="fw-bold">{{ name }} {{ surname }}</h2>
    <p class="text-muted">({{ username }})</p>
    
    {% if is_admin %}
      <span class="badge rounded-pill text-bg-light badge-admin mb-3">Адміністратор</span>
    {% else %}
      <span class="badge rounded-pill text-bg-secondary mb-3">Користувач</span>
    {% endif %}

    <div class="text-start mt-3 mb-4">
      <p><span class="info-label">Email:</span> <span class="info-value">{{ email }}</span></p>
    </div>

    <div class="d-grid gap-2">
      <a href="{{ url_for('index') }}" class="btn btn-outline-primary">
        <i class="bi bi-house-door"></i> На головну
      </a>

      {% if is_admin %}
        <a href="{{ url_for('add_news') }}" class="btn btn-success">
          <i class="bi bi-plus-circle"></i> Додати новину
        </a>

        <a href="{{ url_for('users_database') }}" class="btn btn-warning">
          <i class="bi bi-database"></i> База даних
        </a>
      {% endif %}

      <a href="{{ url_for('logout') }}" class="btn btn-outline-danger">
        <i class="bi bi-box-arrow-right"></i> Вийти
      </a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
