<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Реєстрація</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background: linear-gradient(135deg, #e0f7fa, #f3e5f5);
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .register-card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 2rem;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.15);
      width: 100%;
      max-width: 500px;
      transition: transform 0.3s ease;
      position: relative;
    }

    .register-card:hover {
      transform: translateY(-5px);
    }


  .back-btn {
    position: absolute;
    top: 15px;
    left: 15px;
    background-color: #ede7f6;
    color: #6a1b9a;
    border: none;
    padding: 0.35rem 0.75rem;
    border-radius: 0.6rem;
    font-weight: 600;
    font-size: 0.85rem;
    text-decoration: none;
    transition: 0.3s ease;
    z-index: 10;
  }

  .back-btn:hover {
    background-color: #d1c4e9;
    transform: scale(1.04);
  }

  /* Адаптива */
  @media (max-width: 480px) {
    .back-btn {
      padding: 0.3rem 0.6rem;
      font-size: 0.75rem;
      top: 10px;
      left: 10px;
    }
  }



    h2 {
      text-align: center;
      color: #6a1b9a;
      font-weight: 800;
      margin-bottom: 2rem;
      font-size: 2rem;
    }

    .form-label {
      font-weight: 600;
      color: #4a148c;
    }

    .form-control {
      border-radius: 0.75rem;
      border: 1.5px solid #d1c4e9;
      transition: all 0.3s ease;
    }

    .form-control:focus {
      border-color: #ab47bc;
      box-shadow: 0 0 0 0.2rem rgba(171, 71, 188, 0.25);
    }

    .btn-primary {
      background-color: #6a1b9a;
      border: none;
      border-radius: 0.75rem;
      padding: 0.75rem;
      font-weight: 600;
      transition: background-color 0.3s ease, transform 0.2s ease;
    }

    .btn-primary:hover {
      background-color: #8e24aa;
      transform: scale(1.03);
    }
  </style>
</head>
<body>
  <div class="register-card">
    
    <!-- ✔ КНОПКА НАЗАД НА ГОЛОВНУ -->
    <a href="{{ url_for('index') }}" class="back-btn">⬅ На головну</a>

    <h2>✍️ Реєстрація</h2>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST">
      <div class="mb-3">
        <label class="form-label">Ім’я</label>
        <input type="text" name="name" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Прізвище</label>
        <input type="text" name="surname" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" name="email" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Логін</label>
        <input type="text" name="username" class="form-control" required>
      </div>

      <div class="mb-3">
        <label class="form-label">Пароль</label>
        <input type="password" name="password" class="form-control" required>
      </div>

      <button type="submit" class="btn btn-primary w-100">Зареєструватися</button>
    </form>

    <p class="mt-4 text-center">
      Вже маєте акаунт? <a href="{{ url_for('login') }}">Увійти</a>
    </p>
  </div>
</body>
</html>
