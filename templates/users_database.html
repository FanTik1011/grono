<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>База даних користувачів</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #e2e8f0, #f8fafc);
      font-family: 'Segoe UI', sans-serif;
      padding: 2rem;
    }
    .container {
      background: #fff;
      padding: 2rem;
      border-radius: 1.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
    }
    h2 {
      margin-bottom: 1.5rem;
    }
    .table thead {
      background-color: #f1f5f9;
    }
    .btn-download {
      margin-bottom: 1rem;
    }
    @media (max-width: 576px) {
      .table-responsive {
        font-size: 0.85rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 class="text-center fw-bold">База даних користувачів</h2>

    <div class="d-flex justify-content-between flex-wrap mb-3">
      <a href="{{ url_for('profile') }}" class="btn btn-outline-secondary mb-2">
        ⬅ Повернутися
      </a>
      <a href="{{ url_for('download_users') }}" class="btn btn-primary mb-2 btn-download">
        ⬇ Завантажити users.json
      </a>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle">
        <thead>
          <tr>
            <th>#</th>
            <th>Імʼя</th>
            <th>Прізвище</th>
            <th>Користувач</th>
            <th>Email</th>
            <th>Роль</th>
          </tr>
        </thead>
        <tbody>
          {% for user in users %}
          <tr>
            <td>{{ loop.index }}</td>
            <td>{{ user.name }}</td>
            <td>{{ user.surname }}</td>
            <td>{{ user.username }}</td>
            <td>{{ user.email }}</td>
            <td>
              {% if user.is_admin %}
                <span class="badge bg-success">Адміністратор</span>
              {% else %}
                <span class="badge bg-secondary">Користувач</span>
              {% endif %}
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>

</body>
</html>
